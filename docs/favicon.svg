<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradient matching AnyCert cyan to blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Blue Rounded Rect Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>

  <!-- Golden Yellow Padlock (Centred) -->
  <g filter="url(#glow)">
    <!-- Lock Shackle (Top Ring) -->
    <path d="M 24 30 V 21 C 24 16.5, 27.5 13, 32 13 C 36.5 13, 40 16.5, 40 21 V 30" 
          fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Lock Body -->
    <rect x="19" y="29" width="26" height="20" rx="4" fill="#FBBF24"/>
    
    <!-- Keyhole -->
    <circle cx="32" cy="37" r="2.2" fill="#1E293B"/>
    <path d="M 32 37 L 32 44" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Top-Right Green Online Status Dot -->
  <circle cx="52" cy="12" r="5" fill="#3FB950" stroke="#06B6D4" stroke-width="1.5"/>
</svg>
